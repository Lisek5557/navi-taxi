name: Build APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/build-apk.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Testy jednostkowe
        run: ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug 2>&1 | tee -a build.log; exit ${PIPESTATUS[0]}
      - name: Błędy kompilacji jako adnotacje
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|Exception|expected:" build.log | head -30 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
      - uses: actions/upload-artifact@v4
        with:
          name: TaxiNav-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
      - name: Publikacja APK (stały link do najnowszej wersji)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TaxiNav.apk
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" TaxiNav.apk --repo "${{ github.repository }}" \
            --title "TaxiNav ${{ github.run_number }}" \
            --notes "APK z commita ${{ github.sha }}. Instalacja: otwórz plik na telefonie i zezwól na instalację z nieznanych źródeł." \
            --latest
