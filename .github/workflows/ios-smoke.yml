name: iOS smoke test (symulator)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Build na symulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project TaxiNav.xcodeproj -scheme TaxiNav -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5
      - name: Serwer testowy
        run: |
          nohup node ci/mock-server.mjs > mock.log 2>&1 &
          sleep 5; curl -s localhost:8080/health
      - name: Jazda testowa i zrzuty ekranu
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/TaxiNav.app
          xcrun simctl privacy "$UDID" grant location pl.taxinav || true
          xcrun simctl privacy "$UDID" grant location-always pl.taxinav || true
          xcrun simctl location "$UDID" set 53.1235,18.0084
          mkdir -p shots
          xcrun simctl launch "$UDID" pl.taxinav -server http://localhost:8080 -key sekret -corp zt19622 \
            -openURL "taxinav://navigate?lat=53.1289&lon=18.0204&label=Dworzec&start=1"
          sleep 9
          xcrun simctl io "$UDID" screenshot shots/1-podglad.png
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/2-start.png
          # Jazda ~50 km/h: co sekundę nowa pozycja wzdłuż trasy (800 m na wschód, potem 600 m na północ).
          python3 -c "
          for i in range(58): print('53.1235,%.6f' % (18.0084 + 0.012 * i / 57))
          for i in range(1, 44): print('%.6f,18.0204' % (53.1235 + 0.0054 * i / 43))
          " > drive.txt
          n=0
          while read p; do
            xcrun simctl location "$UDID" set "$p"
            n=$((n+1))
            [ $n -eq 30 ] && xcrun simctl io "$UDID" screenshot shots/3-jazda.png
            [ $n -eq 55 ] && xcrun simctl io "$UDID" screenshot shots/4-przed-skretem.png
            [ $n -eq 75 ] && xcrun simctl io "$UDID" screenshot shots/5-po-skrecie.png
            sleep 1
          done < drive.txt
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/6-koniec.png
          xcrun simctl spawn "$UDID" launchctl list | grep -i taxinav > shots/running.txt || echo "NIE DZIAŁA" > shots/running.txt
          cp mock.log shots/ || true
          find ~/Library/Logs/DiagnosticReports -name "TaxiNav*" -exec cp {} shots/ \; 2>/dev/null || true
          ls -la shots; cat shots/running.txt
      - name: Publikacja zrzutów (szkic wydania)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api repos/${{ github.repository }}/releases --jq '.[] | select(.name=="iOS smoke") | .id'); do gh api -X DELETE repos/${{ github.repository }}/releases/$id; done
          gh release create ios-smoke shots/* --draft --title "iOS smoke" --notes "zrzuty z symulatora" --repo "${{ github.repository }}"
