name: iOS smoke test (symulator)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - name: Build na symulator
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project TaxiNav.xcodeproj -scheme TaxiNav -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -5
      - name: Uruchomienie i zrzuty ekranu
        run: |
          set -x
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys;d=json.load(sys.stdin)['devices'];print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('iPhone 16')))")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build/Build/Products/Debug-iphonesimulator/TaxiNav.app
          xcrun simctl privacy "$UDID" grant location pl.taxinav || true
          xcrun simctl location "$UDID" set 53.1235,18.0084 || true
          mkdir -p shots
          xcrun simctl launch "$UDID" pl.taxinav
          sleep 25
          xcrun simctl io "$UDID" screenshot shots/1-start.png
          xcrun simctl openurl "$UDID" "taxinav://setup?s=https://example.com&k=test"
          sleep 8
          xcrun simctl io "$UDID" screenshot shots/2-setup.png
          xcrun simctl ui "$UDID" appearance dark || true
          sleep 3
          xcrun simctl spawn "$UDID" launchctl list | grep -i taxinav > shots/running.txt || echo "NIE DZIAŁA" > shots/running.txt
          find ~/Library/Logs/DiagnosticReports -name "TaxiNav*" -exec cp {} shots/ \; 2>/dev/null || true
          ls -la shots; cat shots/running.txt
      - name: Publikacja zrzutów (szkic wydania)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-smoke --yes --cleanup-tag --repo "${{ github.repository }}" 2>/dev/null || true
          gh release create ios-smoke shots/* --draft --title "iOS smoke" --notes "zrzuty z symulatora" --repo "${{ github.repository }}"
